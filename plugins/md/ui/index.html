<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Markdown</title>
  <link rel="stylesheet" href="/res/theme/plugin.css" />
  <style>
    /* ══ md · 国风墨水 ══  策略 A：插件内部滚动，滚动条 = 整块右侧满高。 */
    html{ height:100%; overflow:hidden; }
    body{ margin:0; height:100%; box-sizing:border-box; overflow-y:auto; overflow-x:hidden;
      padding:20px 22px 24px; background:transparent; color:var(--ink); font-family:var(--font);
      -webkit-font-smoothing:antialiased; }
    .hidden{ display:none !important; }
    button{ font-family:var(--font); }

    .root{ display:flex; flex-direction:column; height:100%; min-height:0; gap:14px; }

    /* ── 顶栏 ── */
    .toolbar{ display:flex; align-items:center; gap:10px; flex:0 0 auto; flex-wrap:wrap; }
    .t-title{ font-size:15px; font-weight:700; letter-spacing:2px; color:var(--ink); }
    .t-title .badge{ font-weight:400; font-size:11px; color:var(--ink-faint); margin-left:8px;
      max-width:320px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; vertical-align:middle; }
    .count{ font-size:12px; color:var(--ink-soft); }
    #search{ flex:0 1 220px; min-width:140px; background:rgba(255,252,245,.55);
      border:1px solid var(--line); border-radius:9px; padding:7px 12px; color:var(--ink);
      font-family:var(--font); font-size:12px; outline:none; }
    #search:focus{ border-color:var(--gold); }
    .spacer{ flex:1; }

    /* ── 主体两栏 ── */
    .panes{ display:flex; flex:1 1 auto; gap:14px; min-height:0; }
    .sidebar{ flex:0 0 330px; display:flex; flex-direction:column; min-height:0;
      background:var(--card); border:1px solid var(--card-line); border-radius:14px;
      box-shadow:var(--shadow); }
    .sd-head{ display:flex; align-items:center; gap:8px; padding:12px 14px;
      border-bottom:1px solid var(--card-line); }
    .sd-head .tt{ font-size:13px; font-weight:700; letter-spacing:2px; }
    .sd-head .ct{ font-size:11px; color:var(--ink-faint); }
    #file-list{ list-style:none; margin:0; padding:0; overflow-y:auto; flex:1 1 auto; min-height:0; }
    #file-list .item{ display:flex; align-items:center; gap:12px; padding:10px 14px; cursor:pointer;
      border-bottom:1px solid var(--card-line); position:relative; transition:background .12s; }
    #file-list .item:hover{ background:var(--paper-2); }
    #file-list .item.active{ background:var(--code); }
    #file-list .item.active::before{ content:''; position:absolute; left:0; top:0; bottom:0; width:3px;
      background:var(--gold); }
    #file-list .icon{ flex:none; width:36px; height:36px; border-radius:8px; background:rgba(122,104,72,.16);
      color:var(--gold); display:flex; align-items:center; justify-content:center; font-size:12px;
      font-weight:700; letter-spacing:1px; }
    #file-list .meta{ flex:1; min-width:0; }
    #file-list .name{ font-size:13.5px; color:var(--ink); font-weight:600; white-space:nowrap;
      overflow:hidden; text-overflow:ellipsis; display:flex; justify-content:space-between; gap:8px; }
    #file-list .name .sz{ font-weight:400; font-size:11px; color:var(--ink-faint); flex:none; }
    #file-list .sub{ font-size:11.5px; color:var(--ink-soft); white-space:nowrap; overflow:hidden;
      text-overflow:ellipsis; }
    #file-list .time{ font-size:10.5px; color:var(--ink-faint); }
    #file-list .empty{ padding:30px 14px; text-align:center; color:var(--ink-faint); font-size:12px; }

    /* 预览卡片 */
    .preview-pane{ flex:1 1 auto; display:flex; flex-direction:column; min-width:0; min-height:0;
      background:var(--card); border:1px solid var(--card-line); border-radius:14px; box-shadow:var(--shadow); }
    .pv-head{ display:flex; align-items:center; gap:10px; padding:12px 16px;
      border-bottom:1px solid var(--card-line); }
    .pv-head .tt{ font-size:13px; font-weight:700; letter-spacing:2px; }
    .pv-head .dot{ width:8px; height:8px; border-radius:99px; background:var(--gold); }
    .pv-body{ flex:1 1 auto; overflow-y:auto; padding:16px 18px; min-height:0; }

    /* ── 渲染出的 Markdown 共用样式 ── */
    .md-preview{ line-height:1.85; font-size:14.5px; color:var(--ink); }
    .md-preview h1,.md-preview h2,.md-preview h3,.md-preview h4,.md-preview h5,.md-preview h6{
      color:var(--ink); border-bottom:1px solid var(--line); padding-bottom:5px;
      letter-spacing:1px; margin:18px 0 10px; }
    .md-preview h1{ font-size:24px; } .md-preview h2{ font-size:20px; }
    .md-preview h3{ font-size:17px; } .md-preview h4,.md-preview h5,.md-preview h6{ font-size:15px; }
    .md-preview a{ color:var(--gold); text-decoration:none; }
    .md-preview a:hover{ text-decoration:underline; }
    .md-preview code{ background:var(--code); color:#3a352c; padding:1px 5px; border-radius:4px;
      font-family:Consolas,'Courier New',monospace; font-size:12.5px; }
    .md-preview del{ text-decoration:line-through; }
    .md-preview hr{ border:none; border-top:1px solid var(--line); margin:18px 0; }
    .md-preview blockquote{ margin:12px 0; padding:2px 14px; border-left:3px solid var(--gold);
      color:var(--ink-soft); background:var(--code); border-radius:0 8px 8px 0; }
    .md-preview table{ border-collapse:collapse; width:100%; margin:12px 0; }
    .md-preview th{ background:var(--paper-2); border:1px solid var(--line); padding:6px 10px;
      text-align:left; font-weight:700; }
    .md-preview td{ border:1px solid var(--line); padding:6px 10px; }
    .md-preview img{ max-width:100%; border-radius:6px; }
    .md-preview ul,.md-preview ol{ padding-left:24px; }
    .md-preview li{ margin-bottom:3px; }
    .md-preview p{ margin:8px 0; }
    .md-preview .code-block{ margin:14px 0; }
    .md-preview .code-head{ display:flex; align-items:center; justify-content:space-between;
      background:var(--paper-2); border:1px solid var(--line); border-bottom:none;
      border-radius:9px 9px 0 0; padding:5px 10px; font-size:11px; color:var(--ink-soft);
      letter-spacing:1px; }
    .md-preview pre{ margin:0; background:var(--code) !important; color:#3a352c;
      border:1px solid var(--line); border-radius:0 0 9px 9px; padding:12px 14px; font-size:12.5px;
      line-height:1.7; overflow:auto; font-family:Consolas,'Courier New',monospace; white-space:pre; }
    .md-preview supsub{ vertical-align:middle; padding:0 4px; display:inline-block; }

    /* Toast */
    .toast{ position:fixed; left:50%; bottom:22px; transform:translateX(-50%);
      background:var(--ink); color:#FBF7EE; padding:9px 18px; border-radius:20px;
      font-size:12px; letter-spacing:.5px; opacity:0; transition:opacity .25s;
      pointer-events:none; z-index:99; max-width:80vw; }
    .toast.show{ opacity:1; }
    .toast.warn{ background:var(--cinnabar); }
    .toast.ok{ background:var(--celadon); }
  </style>
</head>
<body>
  <div class="root">

    <!-- ════════ 管理页 ════════ -->
    <div class="toolbar">
      <span class="t-title">md 目录<span class="badge" id="dir-badge"></span></span>
      <span class="count" id="count-label">0 个文件</span>
      <div class="spacer"></div>
      <button class="btn ghost mini" id="btn-dir" title="切换 md 工作目录">选择目录</button>
      <button class="btn ghost mini" id="btn-refresh" title="刷新列表">刷新</button>
      <button class="btn mini" id="btn-new" title="在 md 目录新建文件">+ 新建</button>
      <input id="search" placeholder="搜索文件名…" spellcheck="false" />
    </div>

    <div class="panes">
      <div class="sidebar">
        <div class="sd-head">
          <span class="tt">文件</span>
          <span class="ct" id="count-label2"></span>
        </div>
        <ul id="file-list"></ul>
      </div>

      <div class="preview-pane">
        <div class="pv-head">
          <span class="dot"></span><span class="tt">快速预览</span>
          <div class="spacer"></div>
          <button class="btn mini" id="btn-open-editor" disabled>新窗口编辑</button>
        </div>
        <div class="pv-body md-preview" id="preview"></div>
      </div>
    </div>

    <div class="hint" id="hint"></div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="app.js"></script>
  <script src="render.js"></script>
  <script src="ui.js"></script>
</body>
</html>
