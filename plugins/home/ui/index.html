<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>首页</title>
  <link rel="stylesheet" href="/res/theme/plugin.css" />
  <style>
    /* ══ 科技国潮 · 水墨粒子 · 光效工作台 ══ */
    /* 固定纵向排版（不随容器宽度重排）：
       第一行 Hero 独立大块；第二行 智能打卡+工作模式 双卡并排；第三行 网络加速；其后今日任务。 */
    html{ height:100%; overflow:hidden; }
    body{ margin:0; height:100%; box-sizing:border-box; overflow-y:auto; overflow-x:hidden;
      padding:22px 22px 34px; background:transparent; color:var(--ink);
      font-family:var(--font); display:flex; flex-direction:column; gap:18px; align-items:stretch; }
    .card{ flex:0 0 auto; }
    .action-row{ display:flex; gap:18px; width:100%; }
    .action-row > .card{ flex:1 1 0; min-width:0; }
    @media(max-width:760px){ .action-row{ flex-direction:column; } }

    /* 背景：粒子画布 + 远山剪影 */
    #fx{ position:fixed; inset:0; z-index:-2; pointer-events:none; }
    .scene-svg{ position:fixed; left:0; right:0; bottom:0; z-index:-1; pointer-events:none; opacity:.22; }

    /* 通用光效卡片（入场用动画 both 填充，无残留 transform） */
    .card{ position:relative; overflow:hidden; background:var(--card);
      border:1px solid var(--card-line); border-radius:16px; box-shadow:var(--shadow);
      padding:20px; min-width:0; height:min-content; animation:rise .6s cubic-bezier(.16,1,.3,1) both; }
    @keyframes rise{ from{ opacity:0; transform:translateY(16px);} to{ opacity:1; transform:none;} }
    .card::after{ content:''; position:absolute; inset:0; pointer-events:none; border-radius:16px;
      background:linear-gradient(115deg, transparent 30%, rgba(168,135,90,.10) 45%, transparent 60%);
      transform:translateX(-120%); }
    .card.light::after{ animation:shine 4s ease-in-out infinite; }
    @keyframes shine{ 0%,55%{transform:translateX(-120%);} 100%{transform:translateX(130%);} }
    .card>h3{ margin:0 0 16px; font-size:14px; letter-spacing:4px; font-weight:700; padding-left:12px;
      border-left:3px solid var(--gold); display:flex; justify-content:space-between; align-items:center; }
    .card>h3 .hx{ display:inline-flex; align-items:center; gap:8px; }
    .card>h3 .hd{ display:inline-flex; align-items:center; gap:8px; font-size:11px; font-weight:700;
      letter-spacing:2px; color:var(--ink-soft); }
    .card>h3 .hd .dot{ width:8px; height:8px; border-radius:99px; }
    .tag{ display:inline-flex; align-items:center; gap:7px; padding:3px 12px; border-radius:999px;
      font-size:12px; font-weight:700; letter-spacing:2px; border:1px solid var(--card-line); background:var(--card); }
    .tag .dot{ width:8px; height:8px; border-radius:99px; }
    .tag.on{ color:var(--celadon); } .tag.off{ color:var(--ink-soft); } .tag.unknown{ color:var(--ink-faint); }

    /* ══ 第一行 · Hero 大块：标签 + 提示 + 时间 ══ */
    .hero{ padding:30px 30px 26px; display:flex; flex-direction:column; gap:20px; }
    .hero-tag{ display:flex; align-items:center; gap:9px; color:var(--ink-faint); font-size:11px;
      font-weight:700; letter-spacing:2px; }
    .hero-tag .dot{ width:7px; height:7px; border-radius:99px; background:var(--celadon); }
    .hero-tag img{ height:18px; width:18px; display:block; }
    .hero-mid{ display:flex; justify-content:space-between; align-items:center; gap:22px; flex-wrap:wrap; }
    .h-left{ display:flex; flex-direction:column; gap:9px; min-width:0; flex:1; }
    .h-left .grt{ font-size:34px; font-weight:800; letter-spacing:1px; line-height:1; }
    .h-left .date{ font-size:13px; color:var(--ink-soft); letter-spacing:1px; }
    .h-left .hint{ font-size:13px; font-weight:600; }
    .h-right{ display:flex; align-items:flex-end; flex-direction:column; gap:10px; flex:none; }
    .h-right .sc{ font-size:12px; color:var(--cinnabar); letter-spacing:3px; font-weight:700; order:2; }
    .h-right .big{ font-size:46px; font-weight:700; letter-spacing:2px; line-height:1;
      font-family:Consolas,monospace; font-variant-numeric:tabular-nums; }
    .h-right .badge{ padding:4px 16px; border-radius:14px; font-size:11px; font-weight:700;
      color:var(--ink-soft); background:var(--paper-2); border:1px solid var(--card-line); }
    @media(max-width:640px){ .h-right .big{ font-size:34px; } }

    /* 智能打卡 */
    .punch{ display:flex; align-items:center; }
    .punch .p-info{ flex:1; min-width:0; }
    .punch .p-info .st{ font-size:15px; font-weight:700; letter-spacing:1.5px; min-height:22px;
      color:var(--ink); }
    .punch .p-info .sd{ font-size:12px; color:var(--ink-soft); margin-top:6px; letter-spacing:1px; }
    .btn{ position:relative; overflow:hidden; background:linear-gradient(135deg,#b9965f,#8f6f3d);
      color:#FBF7EE; border:none; border-radius:11px; padding:12px 18px; font-family:var(--font);
      font-size:14px; font-weight:700; letter-spacing:3px; cursor:pointer; width:100%; margin-top:16px;
      min-height:48px; box-shadow:0 10px 24px -12px rgba(143,111,61,.7); transition:transform .12s, filter .2s; }
    .btn:hover{ filter:brightness(1.08); }
    .btn:active{ transform:translateY(1px) scale(.99); }
    .btn:disabled{ opacity:.45; cursor:not-allowed; box-shadow:none; }
    .btn .sweep{ position:absolute; inset:0; background:linear-gradient(115deg, transparent 30%, rgba(255,255,255,.35) 50%, transparent 70%);
      transform:translateX(-130%); }
    .btn:hover .sweep{ transform:translateX(130%); transition:transform .8s ease; }
    /* 工作模式 · 描边按钮 */
    .btn.outline{ background:transparent; color:var(--ink); border:1.5px solid var(--ink); box-shadow:none; }
    .btn.outline:hover{ filter:none; background:var(--ink); color:var(--paper); }
    .wm .lead{ display:flex; gap:10px; align-items:center; color:var(--ink-soft); font-size:13px; letter-spacing:1px; }
    .wm .lead .ic{ font-size:26px; }
    .foot{ font-size:11px; color:var(--ink-faint); letter-spacing:1px; margin-top:10px; }

    /* 网络加速滑块（可拖拽 + 山河水墨） */
    .net-head{ display:flex; justify-content:space-between; align-items:center; gap:10px; }
    .net-ip{ font-family:Consolas,monospace; font-size:12px; color:var(--ink-soft); letter-spacing:.5px; }
    .sub-line{ font-size:13px; color:var(--ink-soft); letter-spacing:1px; margin-top:12px; }
    .net-slide{ width:100%; margin:18px auto 0; position:relative; min-width:0; }
    .ns{ position:relative; width:100%; height:40px; padding:0; border:none; background:transparent;
      cursor:grab; touch-action:none; border-radius:20px; box-shadow:var(--shadow); display:block; }
    .ns.dragging{ cursor:grabbing; }
    .ns .art{ position:absolute; inset:0; border-radius:20px; overflow:hidden; background:var(--paper-2);
      border:1px solid var(--card-line); }
    .ns .art img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
    .ns .glowline{ position:absolute; top:50%; left:2px; right:2px; height:2px; transform:translateY(-50%);
      border-radius:2px; background:linear-gradient(90deg, transparent, rgba(168,135,90,.7), transparent);
      opacity:0; transition:opacity .3s; }
    .ns.dragging .glowline, .ns[aria-checked="true"] .glowline{ opacity:1; }
    .ns .knob{ position:absolute; top:50%; left:var(--p,4px); width:30px; height:30px; z-index:2;
      transform:translateY(-50%); border-radius:50%; display:flex; align-items:center; justify-content:center;
      background:radial-gradient(circle at 32% 28%, #faf1d8, #a8875a 60%, #63491f);
      box-shadow:0 4px 14px rgba(30,27,23,.45), 0 0 0 1px rgba(255,255,255,.25) inset,
                0 0 22px rgba(168,135,90,.55);
      transition:left .28s cubic-bezier(.34,1.56,.64,1); }
    .ns.dragging .knob{ transition:none; }
    .knob::after{ content:''; width:26px; height:26px; border-radius:50%; font-size:12px; line-height:1;
      display:flex; align-items:center; justify-content:center; color:rgba(74,52,20,.85);
      border:1px dashed rgba(255,255,255,.5); }
    .ns .knob i{ position:absolute; inset:-6px; border-radius:50%; border:1px solid rgba(168,135,90,.35); }
    .ns[aria-checked="true"] .knob{ box-shadow:0 4px 14px rgba(30,27,23,.45), 0 0 0 1px rgba(255,255,255,.25) inset,
      0 0 34px rgba(210,175,110,.9); }
    .nmeter{ height:3px; margin-top:14px; border-radius:2px; background:var(--paper-2); overflow:hidden; }
    .nmeter i{ display:block; height:100%; width:0; border-radius:2px;
      background:linear-gradient(90deg, #63491f, #d3b173); transition:width .4s; }
    .hint{ font-size:12px; color:var(--ink-faint); letter-spacing:1px; margin-top:12px; }

    /* 今日任务 */
    .addrow{ display:flex; gap:8px; }
    .addrow input{ flex:1; background:rgba(255,252,245,.6); border:1px solid var(--line); border-radius:10px;
      padding:10px 12px; min-height:40px; color:var(--ink); font-family:var(--font); font-size:14px; outline:none; transition:border-color .2s; }
    .addrow input:focus{ border-color:var(--gold); }
    .addrow .add{ flex:none; width:40px; height:40px; border:none; border-radius:10px; cursor:pointer;
      background:linear-gradient(135deg,#b9965f,#8f6f3d); color:#FBF7EE; font-size:20px; line-height:1;
      box-shadow:0 8px 18px -10px rgba(143,111,61,.7); transition:filter .2s; }
    .addrow .add:hover{ filter:brightness(1.08); }
    .count-chip{ padding:2px 10px; border-radius:999px; background:var(--paper-2); border:1px solid var(--card-line);
      font-size:12px; font-weight:700; color:var(--ink-soft); letter-spacing:1px; }
    .mini-ring{ position:relative; width:44px; height:44px; flex:none; border-radius:50%;
      background:conic-gradient(var(--gold) calc(var(--deg)*1deg), var(--paper-2) 0); }
    .mini-ring::before{ content:''; position:absolute; inset:4px; border-radius:50%; background:#FBF7EE; }
    .mini-ring span{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
      font-size:11px; font-weight:700; }
    .list{ margin-top:16px; }
    .item{ display:flex; align-items:center; gap:10px; padding:11px 12px; margin-bottom:8px; border-radius:11px;
      background:rgba(255,252,245,.4); border:1px solid var(--line); position:relative; overflow:hidden; }
    .item .check{ width:19px; height:19px; border-radius:6px; border:1.5px solid var(--gold); flex:none; cursor:pointer;
      display:flex; align-items:center; justify-content:center; transition:background .2s; }
    .item.done .check{ background:var(--gold); }
    .item.done .check::after{ content:'✓'; color:#FBF7EE; font-size:12px; }
    .item .text{ flex:1; font-size:14px; }
    .item.done .text{ text-decoration:line-through; color:var(--ink-faint); }
    .item .del{ flex:none; border:none; background:transparent; color:var(--ink-faint); font-family:var(--font);
      cursor:pointer; font-size:12px; letter-spacing:1px; padding:4px 6px; }
    .item .del:hover{ color:var(--cinnabar); }
    .empty{ color:var(--ink-faint); font-size:13px; letter-spacing:1px; padding:14px 2px; }

    /* 涟漪 */
    .ripple{ position:absolute; border-radius:50%; pointer-events:none; transform:scale(0);
      background:radial-gradient(circle, rgba(168,135,90,.4), transparent 60%); animation:rip .6s ease-out forwards; }
    @keyframes rip{ to{ transform:scale(2.4); opacity:0; } }
    @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }
  </style>
</head>
<body>
  <canvas id="fx"></canvas>
  <svg class="scene-svg" viewBox="0 0 1440 220" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
    <path d="M0 220 L0 150 L120 96 L210 150 L330 60 L430 150 L560 108 L660 160 L790 84 L910 158 L1030 120 L1160 170 L1290 100 L1440 160 L1440 220 Z" fill="rgba(30,27,23,.10)"/>
    <path d="M0 220 L0 182 L140 130 L260 184 L400 112 L520 186 L680 140 L820 190 L980 130 L1100 186 L1260 150 L1440 186 L1440 220 Z" fill="rgba(30,27,23,.16)"/>
  </svg>

  <!-- ══ 第一行 · 独立大块 Hero（标签 logo + 提示 + 时间）══ -->
  <section class="card light hero">
    <div class="hero-tag">
      <span class="dot"></span>
      <img src="/res/logo/octpusY.svg" alt="logo" />
      <span>OCTPLUGIN · 工作台</span>
    </div>
    <div class="hero-mid">
      <div class="h-left">
        <div class="grt" id="heroTip">—</div>
        <div class="date" id="dateLine"></div>
        <div class="hint" id="heroHint"></div>
      </div>
      <div class="h-right">
        <div class="big" id="heroClock">--:--:--</div>
        <span class="sc" id="shichen">当值 — 时</span>
        <span class="badge" id="heroBadge">—</span>
      </div>
    </div>
  </section>

  <!-- ══ 第二行 · 智能打卡 + 工作模式 双卡并排 ══ -->
  <div class="action-row">
    <section class="card light">
      <h3>
        <span class="hx">智能打卡</span>
        <span class="hd"><span class="dot" id="clockDot"></span><span id="clockStatus">—</span></span>
      </h3>
      <div class="punch">
        <div class="p-info">
          <div class="st" id="clockHint">加载中…</div>
          <div class="sd" id="clockSub">最近打卡：—</div>
        </div>
      </div>
      <button class="btn" id="clockBtn"><span class="sweep"></span><span id="clockLab">打卡</span></button>
    </section>

    <section class="card light">
      <h3>
        <span class="hx">工作模式</span>
        <span class="hd"><span class="dot" style="background:var(--ink)"></span>就绪</span>
      </h3>
      <div class="wm">
        <div class="lead"><span class="ic">☕</span><span>启动 home.bat · 一键就位</span></div>
        <div class="foot">后台静默运行 · 不打扰</div>
      </div>
      <button class="btn outline" id="wmBtn"><span class="sweep"></span>一键开启</button>
      <div class="hint" id="wmHint" hidden></div>
    </section>
  </div>

  <!-- ══ 第三行 · 网络加速 ══ -->
  <section class="card light">
    <h3>
      <span class="hx">网络加速</span>
      <span class="hd"><span class="dot" id="netDot"></span><span id="netState">检测中…</span></span>
    </h3>
    <div class="sub-line"><span id="netIp">当前 IP：检测中…</span></div>
    <div class="net-slide">
      <button id="netSwitch" class="ns" role="switch" aria-checked="false" title="拖动切换网络加速">
        <span class="glowline"></span>
        <span class="art">
          <img id="netArt" src="/res/shanhe12/white_1.svg" alt="" />
        </span>
        <span class="knob"><i></i></span>
      </button>
    </div>
    <div class="nmeter"><i id="netMeter"></i></div>
    <div class="hint" id="netHint">拖动山河画卷切换加速 · 30s 后自动校验。</div>
  </section>

  <!-- 今日任务 -->
  <section class="card light">
    <h3>
      <span class="hx">今日任务<span class="count-chip" id="countChip" style="margin-left:10px">0 / 0</span></span>
      <span class="mini-ring" id="taskRing" style="--deg:0"><span id="taskPct"></span></span>
    </h3>
    <div class="addrow">
      <input id="taskInput" placeholder="添加一项任务，回车确认" />
      <button class="add" id="taskAdd">＋</button>
    </div>
    <div class="list" id="taskList"></div>
    <div class="empty" id="taskEmpty" hidden>尚无任务，今日一身轻。</div>
  </section>

  <script src="app.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const rpc = (m, p) => window.OCT.callHome(m, p);
    const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
    const two = n => String(n).padStart(2, '0');
    const DNG = '#b23a30', WRN = '#a8875a', INK = '#1e1b17', MUTED = '#5c564c', SOFT = '#71717a';
    let amDone = false, pmDone = false, lastIso = '';

    // ══ 背景粒子（金墨浮尘） ══
    (() => {
      const cv = $('fx'), cx = cv.getContext('2d');
      let w = cv.width = innerWidth, h = cv.height = innerHeight, M = [];
      const N = reduce ? 0 : Math.min(70, innerWidth / 16);
      for (let i = 0; i < N; i++) {
        M.push({ x: Math.random() * w, y: Math.random() * h, r: Math.random() * 2.6 + .4,
          s: Math.random() * .35 + .08, o: Math.random() * .5 + .2,
          ph: Math.random() * 6.283, sp: Math.random() * .012 + .004 });
      }
      addEventListener('resize', () => { w = cv.width = innerWidth; h = cv.height = innerHeight; });
      (function loop(t){
        cx.clearRect(0, 0, w, h);
        for (const p of M) {
          p.y -= p.s; p.ph += p.sp;
          if (p.y < -10) { p.y = h + 10; p.x = Math.random() * w; }
          cx.beginPath();
          cx.fillStyle = `rgba(168,135,90,${p.o * (0.6 + 0.4 * Math.sin(p.ph))})`;
          cx.shadowColor = 'rgba(168,135,90,.6)'; cx.shadowBlur = 10;
          cx.arc(p.x + Math.sin(p.ph * 2) * 18, p.y, p.r, 0, 6.283); cx.fill();
        }
        cx.shadowBlur = 0;
        requestAnimationFrame(loop);
      })();
    })();

    // ══ 时辰 ══
    const SHI = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
    const shichen = h => SHI[Math.floor(((h + 1) % 24) / 2)];

    // ══ Hero：复刻 OCTools greeting 逻辑 ══
    const hm = s2 => { s2 = Math.max(0, Math.floor(s2)); const h = Math.floor(s2/3600), m = Math.floor((s2%3600)/60); return h ? h+'小时'+two(m)+'分' : m+'分'; };
    const ms = s2 => { s2 = Math.max(0, Math.floor(s2)); return two(Math.floor(s2/60)) + '分' + two(s2%60) + '秒'; };
    function heroOf(d){
      const minute = d.getHours()*60 + d.getMinutes();
      const secs = d.getHours()*3600 + d.getMinutes()*60 + d.getSeconds();
      const cur = two(d.getHours())+':'+two(d.getMinutes())+':'+two(d.getSeconds());
      const left = t => t*60 - secs;
      let tip, clock, color, badge, isCountdown = true;
      if (minute < 9*60){
        if (amDone){ tip='距离吃饭还剩'; clock=hm(left(12*60)); color=INK; badge='已打卡'; }
        else { tip='请打卡'; clock=hm(left(9*60)); color=WRN; badge='请打卡'; }
      } else if (minute < 9*60+5){
        if (amDone){ tip='距离吃饭还剩'; clock=hm(left(12*60)); color=INK; badge='已打卡'; }
        else { tip='请补卡'; clock='超时 '+ms(-left(9*60)); color=DNG; badge='请补卡'; }
      } else if (minute < 12*60){ tip='距离吃饭还剩'; clock=hm(left(12*60)); color=INK; badge='工作中'; }
      else if (minute < 13*60){ tip='午休时间'; clock=cur; color=INK; badge='午休'; isCountdown=false; }
      else if (minute < 17*60+30){ tip='距离下班还剩'; clock=hm(left(18*60)); color=INK; badge='工作中'; }
      else if (minute < 18*60){ tip='记得打卡，开启倒计时'; clock=hm(left(18*60)); color=WRN; badge='待打卡'; }
      else if (pmDone){ tip='下班！'; clock=cur; color=INK; badge='已打卡'; isCountdown=false; }
      else { tip='快打卡'; clock=cur; color=DNG; badge='待打卡'; isCountdown=false; }
      let hint, hintColor;
      if (isCountdown){ hint='› 现在 '+cur; hintColor=MUTED; }
      else { const sh = lastIso.slice(11,19); hint = sh ? '› 最近打卡 '+sh : '› 今日尚未打卡'; hintColor = color; }
      return { tip, clock, color, badge, hint, hintColor, isCountdown };
    }
    function badgeQss(color){
      return color === DNG ? 'color:#fff;background:#b23a30;border:none;'
        : color === WRN ? 'color:#fff;background:#a8875a;border:none;'
        : 'color:#71717a;background:var(--paper-2);border:1px solid var(--card-line);';
    }
    function tickHero(){
      const d = new Date();
      const g = heroOf(d);
      $('heroTip').textContent = g.tip;
      $('heroTip').style.color = g.color;
      $('heroTip').style.fontSize = g.tip.length > 7 ? '30px' : '34px';
      $('heroClock').textContent = g.clock;
      $('heroClock').style.color = g.color;
      $('heroClock').style.fontSize = (g.isCountdown && g.clock.length > 7) ? '40px' : '46px';
      $('heroBadge').textContent = g.badge;
      $('heroBadge').style.cssText = badgeQss(g.color) + ' padding:4px 16px;border-radius:14px;font-size:11px;font-weight:700;letter-spacing:1px;';
      $('heroHint').textContent = g.hint;
      $('heroHint').style.color = g.hintColor;
      $('dateLine').textContent = d.getFullYear() + ' 年 ' + two(d.getMonth()+1) + ' 月 ' + two(d.getDate()) + ' 日   星期' + '日一二三四五六'[d.getDay()];
      $('shichen').textContent = '当值 ' + shichen(d.getHours()) + ' 时';
    }
    tickHero();
    setInterval(() => tickHero(), 1000);

    // ══ 入场（错落显现 · 仅延时，transform 由动画处理） ══
    (() => {
      document.querySelectorAll('.card').forEach((c, i) => { c.style.animationDelay = (i * 90) + 'ms'; });
    })();

    // ══ 涟漪 ══
    if (!reduce) document.addEventListener('pointerup', e => {
      if (!e.target.closest('.btn,.item .check,.ns')) return;
      const r = e.target.closest('.btn,.item .check').getBoundingClientRect();
      const s = 40, sp = document.createElement('span');
      sp.className = 'ripple'; sp.style.cssText = `left:${e.clientX-r.left-s/2}px;top:${e.clientY-r.top-s/2}px;width:${s}px;height:${s}px`;
      e.target.closest('.btn,.item .check').style.position = 'relative';
      e.target.closest('.btn,.item .check').appendChild(sp);
      setTimeout(() => sp.remove(), 600);
    });

    function renderEl(id, t){ const e = $(id); if (e) e.textContent = t ?? ''; }
    function renderClock(c, lastTime){
      const state = c.done ? 'done' : (c.slot === 'am' || c.slot === 'pm' ? 'pending' : 'none');
      const before18 = new Date().getHours() * 60 + new Date().getMinutes() < 18 * 60; // 未到 18:00 禁止打卡
      const statusMap = { done:['已完成','var(--celadon)'], pending:[ before18 ? '未到' : '待打卡', before18 ? 'var(--ink-faint)' : 'var(--ink)'], none:['等待中','var(--ink-faint)'] }[state];
      $('clockStatus').textContent = statusMap[0];
      $('clockDot').style.background = statusMap[1];
      $('clockHint').textContent = before18 ? '未到 18:00' : (c.hint || '');
      $('clockHint').style.color = before18 ? 'var(--ink-faint)' : 'var(--ink)';
      const shown = (lastTime || '').slice(11, 19);
      $('clockSub').textContent = shown ? '最近打卡：' + shown : '最近打卡：—';
      const btn = $('clockBtn'), lab = $('clockLab');
      if (c.done){ btn.disabled = true; lab.textContent = '本时段已完成'; }
      else if (c.slot && before18){ btn.disabled = true; lab.textContent = '未到 18:00'; }
      else if (c.slot){ btn.disabled = false; lab.textContent = '立即打卡'; }
      else { btn.disabled = true; lab.textContent = '暂不可打卡'; }
    }
    $('clockBtn').addEventListener('click', async () => {
      try {
        const slot = (await rpc('state', {})).clockin.slot;
        const before18 = new Date().getHours() * 60 + new Date().getMinutes() < 18 * 60;
        if (!slot || slot === 'none' || before18) return; // 未到 18:00 禁止打卡
        await rpc('clockin', { slot }); await load();
      } catch(e){ renderEl('clockHint', '打卡失败：' + e.message); }
    });
    // 定时刷新打卡状态，跨过 18:00 时自动放开按钮
    setInterval(async () => {
      try { const _st = await rpc('state', {}); renderClock(_st.clockin, _st.last_iso); } catch(e){}
    }, 20000);

    // ══ 工作模式 ══
    $('wmBtn').addEventListener('click', async () => {
      $('wmHint').textContent = '';
      try { const r = await rpc('workmode', {}); $('wmHint').hidden = false; renderEl('wmHint', r.ok ? '已启动，后台静默运行中。' : '启动失败：' + (r.error || '')); }
      catch(e){ $('wmHint').hidden = false; renderEl('wmHint', '调用失败：' + e.message); }
    });

    // ══ 网络加速：可拖拽滑块 + 乐观 30s 校验 ══
    const ns = $('netSwitch'), KNOB = 30;
    let netOn = false, netOptimistic = false, netTimer = null;
    const NET_ART = id => '/res/shanhe12/white_' + id + '.svg';
    function setRatio(r){ ns.style.setProperty('--p', (r * (ns.clientWidth - KNOB) + 4) + 'px'); ns.setAttribute('aria-checked', r >= .5 ? 'true' : 'false'); $('netArt').src = NET_ART(Math.max(1, Math.min(6, Math.round(r * 5) + 1))); }
    function snap(on){ setRatio(on ? 1 : 0); $('netMeter').style.width = on ? '100%' : '0%'; }
    function setNetUI(state){ $('netState').textContent = state === 'on' ? '已开启' : (state === 'off' ? '已关闭' : '未知'); $('netDot').style.background = state === 'on' ? 'var(--celadon)' : (state === 'off' ? 'var(--ink-soft)' : 'var(--ink-faint)'); }
    function applyNet(desired){
      if (netOptimistic) return;
      netOptimistic = true; snap(desired); setNetUI(desired ? 'on' : 'off');
      $('netHint').textContent = desired ? '正在开启加速…（30s 后校验）' : '正在关闭加速…（30s 后校验）';
      rpc('net.toggle', { on: desired })
        .then(r => { if (!r.ok) throw new Error(r.error || '切换失败'); clearTimeout(netTimer); netTimer = setTimeout(() => { netOptimistic = false; probeNet(true); }, 30000); })
        .catch(e => { netOptimistic = false; snap(!desired); setNetUI(netOn ? 'on' : 'off'); $('netHint').textContent = '切换失败：' + e.message; });
    }
    function ratioOf(e){ const r = ns.getBoundingClientRect(); let v = (e.clientX - r.left - 4) / (r.width - KNOB); return Math.max(0, Math.min(1, v)); }
    ns.addEventListener('pointerdown', e => { if (!e.isPrimary) return; ns.setPointerCapture(e.pointerId); ns.classList.add('dragging'); setRatio(ratioOf(e)); });
    ns.addEventListener('pointermove', e => { if (ns.classList.contains('dragging')) setRatio(ratioOf(e)); });
    function release(e){
      if (!ns.classList.contains('dragging')) return;
      ns.classList.remove('dragging');
      const v = ratioOf(e) >= .5;
      if (v !== netOn) applyNet(v); else snap(netOn);
    }
    ns.addEventListener('pointerup', release);
    ns.addEventListener('pointercancel', release);
    ns.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); applyNet(!netOn); } });
    async function probeNet(apply){
      try {
        const s = await rpc('net.status', {});
        if (s.ip && s.off === undefined) $('netIp').textContent = '当前 IP：' + s.ip;
        if (apply && !netOptimistic){
          const real = s.state === 'on'; netOn = real; snap(real); setNetUI(s.state);
          $('netHint').textContent = real ? '加速已生效。' : (s.state === 'off' ? '未检测到加速。' : '状态未知。');
        }
      } catch(e){}
    }

    // ══ 今日任务 ══
    function itemRow(t){
      const row = document.createElement('div'); row.className = 'item' + (t.done ? ' done' : '');
      const chk = document.createElement('span'); chk.className = 'check';
      const txt = document.createElement('span'); txt.className = 'text'; txt.textContent = t.text;
      const del = document.createElement('button'); del.className = 'del'; del.textContent = '删除';
      chk.onclick = async () => { try { await rpc('task.toggle', { id: t.id, done: !t.done }); await load(); } catch(e){} };
      del.onclick = async () => { try { await rpc('task.remove', { id: t.id }); await load(); } catch(e){} };
      row.append(chk, txt, del); return row;
    }
    function renderTasks(ts){
      ts = ts || [];
      $('taskList').innerHTML = ''; $('taskEmpty').hidden = ts.length > 0;
      ts.forEach(t => $('taskList').appendChild(itemRow(t)));
      const done = ts.filter(t => t.done).length, pct = ts.length ? Math.round(done / ts.length * 100) : 0;
      $('taskRing').style.setProperty('--deg', pct * 3.6);
      $('taskPct').textContent = ts.length ? done + '/' + ts.length : '';
      $('countChip').textContent = done + ' / ' + ts.length;
    }
    $('taskAdd').addEventListener('click', async () => {
      const v = $('taskInput').value.trim(); if (!v) return;
      try { await rpc('task.add', { text: v }); $('taskInput').value = ''; await load(); } catch(e){}
    });
    $('taskInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('taskAdd').click(); });

    // ══ 综合加载 ══
    async function load(){
      try {
        const st = await rpc('state', {});
        amDone = !!st.am_done; pmDone = !!st.pm_done; lastIso = st.last_iso || '';
        renderClock(st.clockin, st.last_iso); renderTasks(st.tasks);
      } catch(e){ renderEl('clockHint', '读取失败：' + e.message); }
    }
    window.addEventListener('oct.error', e => renderEl('clockHint', '桥错误：' + e.detail));
    window.addEventListener('oct.ready', () => { load(); probeNet(true); setInterval(() => probeNet(true), 8000); });
  </script>
</body>
</html>
