<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>转换</title>
  <link rel="stylesheet" href="/res/theme/plugin.css" />
  <style>
    /* ══ 转换 · 单位换算 · 国风墨水 ══
       策略 A：插件内部滚动，滚动条 = 整块右侧满高一条。 */
    html{ height:100%; overflow:hidden; }
    body{ margin:0; height:100%; box-sizing:border-box; overflow-y:auto; overflow-x:hidden;
      padding:22px; background:transparent; color:var(--ink); font-family:var(--font); }

    .card{ flex:0 0 auto; }
    .card h3{ display:flex; align-items:center; gap:8px; }
    .card h3 .dot{ width:8px; height:8px; border-radius:99px; background:var(--gold); }

    /* 表单：类别 / 从 / 目标 / 数值 */
    .form-grid{ display:grid; gap:12px; }

    .field select{ width:100%; background:rgba(255,252,245,.55); border:1px solid var(--line);
      border-radius:9px; padding:9px 12px; color:var(--ink); font-family:var(--font);
      font-size:14px; outline:none; cursor:pointer; }
    .field select:focus{ border-color:var(--gold); }

    .num-row{ display:flex; gap:10px; }
    .num-row input{ flex:1; background:rgba(255,252,245,.55); border:1px solid var(--line);
      border-radius:9px; padding:9px 12px; color:var(--ink); font-family:Consolas,'Courier New',monospace;
      font-size:15px; outline:none; }
    .num-row input:focus{ border-color:var(--gold); }

    /* 目标结果 */
    .result-box{ margin-top:14px; display:flex; align-items:center; gap:12px;
      flex-wrap:wrap; }
    .result-val{ font-family:Consolas,'Courier New',monospace; font-size:22px; font-weight:700;
      letter-spacing:1px; color:var(--ink); word-break:break-all; }
    .result-unit{ font-size:14px; color:var(--ink-soft); letter-spacing:1px; }

    /* 全量结果表 */
    table{ width:100%; border-collapse:collapse; margin-top:6px; }
    th{ text-align:left; font-size:12px; color:var(--ink-soft); letter-spacing:2px;
      padding:8px 10px; border-bottom:1px solid var(--line); font-weight:700; }
    td{ padding:8px 10px; border-bottom:1px solid var(--line); font-size:14px; }
    tr:last-child td{ border-bottom:none; }
    tr:hover td{ background:rgba(168,135,90,.06); }
    .td-unit{ color:var(--ink-soft); font-size:13px; letter-spacing:1px; white-space:nowrap; }
    .td-num{ font-family:Consolas,'Courier New',monospace; font-size:13.5px;
      cursor:pointer; border-radius:6px; padding:2px 6px; transition:background .15s; }
    .td-num:hover{ background:var(--code); }
    .copy-hint{ font-size:11px; color:var(--ink-faint); letter-spacing:1px; margin-top:6px; }

    .sub{ color:var(--ink-soft); font-size:12px; letter-spacing:1px; }
    .hint{ margin-top:8px; font-size:12px; color:var(--ink-soft); letter-spacing:1px; }

    /* Toast（墨黑底） */
    .toast{ position:fixed; left:50%; bottom:20px; transform:translateX(-50%);
      background:var(--ink); color:#FBF7EE; padding:9px 16px; border-radius:20px;
      font-size:12px; letter-spacing:.5px; opacity:0; transition:opacity .25s;
      pointer-events:none; z-index:99; }
    .toast.show{ opacity:1; }
  </style>
</head>
<body>

  <div class="card">
    <h3><span class="dot"></span>单位换算</h3>
    <div class="form-grid">
      <div class="field">
        <label>类别</label>
        <select id="cat"></select>
      </div>
      <div class="row">
        <div class="field" style="flex:1"><label>从单位</label><select id="from"></select></div>
        <div class="field" style="flex:1"><label>目标单位</label><select id="to"></select></div>
      </div>
      <div class="field">
        <label>数值</label>
        <div class="num-row">
          <input id="value" type="number" step="any" placeholder="输入数值" />
          <button class="btn" id="convert-btn">转换</button>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <h3><span class="dot"></span>转换结果</h3>
    <div class="result-box" id="result-box">
      <span class="result-val" id="result-val" title="点击复制">—</span>
      <span class="result-unit" id="result-unit"></span>
      <button class="btn ghost mini" id="copy-btn">一键复制结果</button>
    </div>
    <div class="sub hint" id="result-empty">在上方选择单位并输入数值后点击「转换」。</div>
  </div>

  <div class="card">
    <h3><span class="dot"></span>全部单位换算</h3>
    <div class="copy-hint">点击任意数值即复制</div>
    <table>
      <thead><tr><th style="width:120px">单位</th><th>数值</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="sub hint" id="table-empty">转换后将在此列出该数值在所有同类单位下的结果。</div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
  <script src="ui.js"></script>
</body>
</html>
