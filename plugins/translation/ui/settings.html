<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>模型参数 · 翻译</title>
  <link rel="stylesheet" href="/res/theme/plugin.css" />
  <style>
    html{ height:100%; overflow:hidden; }
    body{ margin:0; height:100%; box-sizing:border-box; overflow-y:auto; overflow-x:hidden;
      padding:20px; background:#f5efe0; color:var(--ink); font-family:var(--font); }

    .hd{ display:flex; align-items:baseline; gap:10px; margin-bottom:16px;
      padding-left:10px; border-left:3px solid var(--gold); }
    .hd h1{ font-size:16px; margin:0; letter-spacing:3px; }
    .hd span{ font-size:12px; color:var(--ink-faint); letter-spacing:1px; }

    .field{ margin-bottom:12px; }
    .field label{ display:block; color:var(--ink-soft); font-size:12px; letter-spacing:1px; margin-bottom:6px; }
    .field input[type=text], .field input[type=number], .field select{
      width:100%; background:rgba(255,252,245,.7); border:1px solid var(--line);
      border-radius:9px; padding:8px 12px; color:var(--ink); font-family:var(--font);
      font-size:13px; outline:none; }
    .field input:focus, .field select:focus{ border-color:var(--gold); }
    .field.check{ display:flex; align-items:center; gap:8px; }
    .field.check label{ margin:0; display:inline; }
    .field.check input{ width:16px; height:16px; accent-color:var(--gold); }

    .sec{ font-size:13px; font-weight:700; letter-spacing:2px; color:var(--gold);
      margin:20px 0 12px; padding-bottom:6px; border-bottom:1px solid var(--card-line); }

    .grid2{ display:grid; gap:12px 16px; grid-template-columns:1fr 1fr; }
    @media (max-width:560px){ .grid2{ grid-template-columns:1fr; } }

    .actions{ display:flex; gap:12px; margin-top:22px; padding-top:16px;
      border-top:1px solid var(--card-line); }
    .actions .btn{ flex:1; }

    .note{ font-size:11px; color:var(--ink-faint); letter-spacing:.5px; margin-top:4px; }

    .toast{ position:fixed; left:50%; bottom:20px; transform:translateX(-50%);
      background:var(--ink); color:#FBF7EE; padding:9px 16px; border-radius:20px;
      font-size:12px; letter-spacing:.5px; opacity:0; transition:opacity .25s;
      pointer-events:none; z-index:99; max-width:80%; text-align:center; }
    .toast.show{ opacity:1; }
  </style>
</head>
<body>

  <div class="hd">
    <h1>模型参数</h1>
    <span>翻译引擎 · 预加载 · 悬浮窗 · 语音识别</span>
  </div>

  <div class="field">
    <label>翻译引擎</label>
    <select id="engine-select">
      <option value="hy">Hy-MT2-1.8B（本地大模型，推荐）</option>
      <option value="opusmt">Opus-MT（轻量）</option>
    </select>
  </div>

  <div class="sec">模型预加载</div>
  <div class="grid2">
    <div class="field check">
      <input type="checkbox" id="preload_models"><label for="preload_models">启用后台预加载</label>
    </div>
    <div class="field">
      <label>预加载时机</label>
      <select id="preload_timing">
        <option value="startup">启动时（startup）</option>
        <option value="tab">打开翻译页时（tab）</option>
      </select>
    </div>
  </div>

  <div class="sec">悬浮窗显示</div>
  <div class="grid2">
    <div class="field">
      <label>悬浮窗字号（px）</label>
      <input type="number" id="overlay_font_size" min="8" max="48">
    </div>
    <div class="field">
      <label>显示模式</label>
      <select id="overlay_mode">
        <option value="both">双语（原文 + 译文）</option>
        <option value="trans">仅译文</option>
      </select>
    </div>
    <div class="field">
      <label>背景色（#RRGGBB 或 transparent）</label>
      <input type="text" id="overlay_bg_color">
    </div>
    <div class="field">
      <label>背景透明度（0–1）</label>
      <input type="number" id="overlay_alpha" min="0" max="1" step="0.05">
    </div>
    <div class="field check">
      <input type="checkbox" id="overlay_pin_default"><label for="overlay_pin_default">启动时默认固定悬浮窗</label>
    </div>
  </div>

  <div id="hy-group">
    <div class="sec">Hy-MT2-1.8B 参数</div>
    <div class="field">
      <label>模型路径（GGUF）</label>
      <input type="text" id="hy_model_path" placeholder="模型文件完整路径（.gguf）">
      <div class="note">默认读取环境变量 / 全局模型目录</div>
    </div>
    <div class="grid2">
      <div class="field"><label>上下文窗口 hy_n_ctx</label><input type="number" id="hy_n_ctx" min="256"></div>
      <div class="field"><label>线程数 hy_n_threads</label><input type="number" id="hy_n_threads" min="1"></div>
      <div class="field"><label>GPU 层 hy_n_gpu_layers（0=纯CPU）</label><input type="number" id="hy_n_gpu_layers" min="0"></div>
      <div class="field"><label>最大生成长度 hy_max_tokens</label><input type="number" id="hy_max_tokens" min="16"></div>
      <div class="field"><label>温度 hy_temperature</label><input type="number" id="hy_temperature" step="0.05" min="0" max="2"></div>
      <div class="field"><label>Top-P hy_top_p</label><input type="number" id="hy_top_p" step="0.05" min="0" max="1"></div>
      <div class="field"><label>Top-K hy_top_k</label><input type="number" id="hy_top_k" min="1"></div>
      <div class="field"><label>重复惩罚 hy_repeat_penalty</label><input type="number" id="hy_repeat_penalty" step="0.01" min="1"></div>
    </div>
  </div>

  <div id="opus-group">
    <div class="sec">Opus-MT 参数</div>
    <div class="field">
      <label>模型目录 opusmt_base（CTranslate2 目录）</label>
      <input type="text" id="opusmt_base">
    </div>
  </div>

  <div class="sec">语音识别（屏幕字幕 / 语音翻译）</div>
  <div class="grid2">
    <div class="field">
      <label>模型目录（含 model.onnx + tokens.txt）</label>
      <input type="text" id="stt_model_dir">
    </div>
    <div class="field">
      <label>设备</label>
      <select id="stt_device">
        <option value="cpu">CPU（纯离线）</option>
        <option value="cuda">CUDA（GPU，需显卡驱动）</option>
      </select>
    </div>
    <div class="field">
      <label>识别语言</label>
      <select id="stt_language">
        <option value="auto">自动检测（中/英等）</option>
        <option value="zh">中文</option>
        <option value="en">英文</option>
        <option value="yue">粤语</option>
        <option value="ja">日语</option>
        <option value="ko">韩语</option>
      </select>
    </div>
    <div class="field">
      <label>推理线程数 sherpa_num_threads</label>
      <input type="number" id="stt_sherpa_num_threads" min="1">
    </div>
  </div>

  <div class="actions">
    <button class="btn ghost" id="default-btn">恢复默认</button>
    <button class="btn" id="save-btn">保　存</button>
  </div>

  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
  <script src="settings.js"></script>
</body>
</html>
